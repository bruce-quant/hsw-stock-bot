# Checks every push and pull request: lint, format, types, tests.
# It never trades, needs no secrets, and has no schedule.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Lint (ruff)
        run: ruff check .
      - name: Format (ruff)
        run: ruff format --check .
      - name: Types (mypy, strict)
        run: mypy
      - name: Tests (pytest, offline)
        run: pytest
