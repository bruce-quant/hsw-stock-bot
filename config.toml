# HSW Stock Bot settings.
#
# Every number the bot and the backtest use lives in this one file.
# The strategy numbers below were picked from common, well known conventions
# BEFORE the first backtest ran. They were never tuned to make results look better.
# If you change them, run the full stress test again (see docs/HOW_WE_TRADE.md).
#
# Paths are relative to this file.

[data]
cache_dir = "data"              # downloaded daily bars are saved here (not committed to git)
history_start = "2002-01-01"    # first day to download; the extra years warm up the long averages
benchmark = "SPY"               # the "just buy the market" yardstick
cash_symbol = "SHY"             # the "just hold cash" yardstick (a short term Treasury fund)

[backtest]
start = "2004-01-01"            # first day the backtest is allowed to trade
starting_cash = 10000.0         # a small account, in dollars
split_date = "2015-01-01"       # results before this day are "in sample", from it on "out of sample"
random_entry_runs = 2000        # how many random traders the random entry test builds
random_seed = 42                # fixed, so every run of the report gives the same numbers

[costs]
# Alpaca charges no commission on stocks and ETFs. Trading still costs money:
# you buy a bit above the fair price and sell a bit below it (the spread and slippage).
slippage_bps = 5.0              # 5 basis points = 0.05% on every buy and every sell
commission_per_order = 0.0      # dollars per order
stress_multiplier = 2.0         # the stress test doubles every cost

[sizing]
cash_reserve_pct = 0.02         # keep 2% in cash so a gap at the open cannot overdraw the account
min_order_dollars = 10.0        # skip orders smaller than this
min_fill_pct = 0.5              # open a position only if the cash covers at least half its planned size

[report]
strategies = ["steady", "swing"]
# Recent windows, measured in trading days (about 21 per month).
windows = { "Last 1 month" = 21, "Last 6 months" = 126, "Last 2 years" = 504 }

# ---------------------------------------------------------------------------
# Stock lists. A strategy points at one of these by name.
# ---------------------------------------------------------------------------
[universes]
# Sector SPDR funds plus broad index funds.
etfs = [
  "SPY", "QQQ", "IWM", "MDY",
  "XLB", "XLC", "XLE", "XLF", "XLI", "XLK", "XLP", "XLRE", "XLU", "XLV", "XLY",
]
# S&P 100 members, from the Wikipedia component table dated 2026-09-21 (read 2026-11-21).
# GOOG is left out because GOOGL is the same company. Yahoo writes BRK.B as BRK-B.
# This is TODAY's list. Using it for old years makes backtests look better than reality.
sp100 = [
  "AAPL", "ABBV", "ABT", "ACN", "ADBE", "AMAT", "AMD", "AMGN", "AMT", "AMZN",
  "ANET", "AVGO", "AXP", "BA", "BAC", "BKNG", "BLK", "BMY", "BNY", "BRK-B",
  "C", "CAT", "CMCSA", "COF", "COP", "COST", "CRM", "CSCO", "CVS", "CVX",
  "DE", "DELL", "DHR", "DIS", "DUK", "EMR", "FDX", "GD", "GE", "GEV",
  "GILD", "GM", "GOOGL", "GS", "HD", "IBM", "INTC", "INTU", "ISRG", "JNJ",
  "JPM", "KO", "LIN", "LLY", "LMT", "LOW", "LRCX", "MA", "MCD", "MDLZ",
  "MDT", "META", "MMM", "MO", "MRK", "MS", "MSFT", "MU", "NEE", "NFLX",
  "NOW", "NVDA", "ORCL", "PANW", "PEP", "PFE", "PG", "PLTR", "PM", "QCOM",
  "RTX", "SBUX", "SCHW", "SNDK", "SO", "T", "TMO", "TMUS", "TSLA", "TXN",
  "UBER", "UNH", "UNP", "UPS", "USB", "V", "VZ", "WFC", "WMT", "XOM",
]

# ---------------------------------------------------------------------------
# Strategy A: Steady. Monthly rotation between funds. Holds for weeks to months.
# ---------------------------------------------------------------------------
[strategies.steady]
universe = "etfs"
safe_asset = "SHY"              # 1 to 3 year Treasury fund (USA), the place to wait when the trend is down
market_symbol = "SPY"           # the trend filter looks at this fund
momentum_days = [63, 126, 252]  # 3, 6 and 12 months; the score is the average of the three returns
top_n = 3                       # hold the 3 strongest funds
max_positions = 3
max_position_pct = 1.0          # the slot weights (one third each) already limit each fund
risk_per_trade = 0.0            # 0 = no stop based sizing; each fund gets an equal slice

# ---------------------------------------------------------------------------
# Strategy B: Swing. Buys short dips inside strong uptrends. Holds for days to weeks.
# ---------------------------------------------------------------------------
[strategies.swing]
universe = "sp100"
trend_fast_days = 50            # uptrend: price above the 200 day average,
trend_slow_days = 200           # and the 50 day average above the 200 day average
band_days = 20                  # the dip: close below the lower Bollinger band (20 days,
band_std = 2.0                  # 2 standard deviations); sell when the close is back above the 20 day average
atr_days = 14                   # average true range, the "normal daily move"
stop_atr = 3.0                  # stop loss: 3 normal daily moves below the signal close
max_hold_days = 20              # time stop: sell after 20 trading days (about one month)
momentum_days = 126             # 6 month return, one part of the ranking score
max_positions = 5
max_position_pct = 0.20         # never more than 20% of the account in one stock
risk_per_trade = 0.01           # lose about 1% of the account if the stop is hit

# ---------------------------------------------------------------------------
# Your own strategy. A working example to copy and change. See docs/MAKE_YOUR_OWN.md.
# It has NOT been through the stress test. Do not trade it with real money as it is.
# ---------------------------------------------------------------------------
[strategies.my_strategy]
universe = "sp100"
trend_days = 100
breakout_days = 50
exit_days = 50
atr_days = 20
stop_atr = 2.0
max_hold_days = 40
max_positions = 5
max_position_pct = 0.20
risk_per_trade = 0.01

# ---------------------------------------------------------------------------
# The bot (paper trading by default). See docs/SETUP_ALPACA.md.
# ---------------------------------------------------------------------------
[bot]
# Which strategies trade, and what share of the account each one gets.
# A share of 0 means "sell only": the strategy closes its positions on its normal rules
# and buys nothing new. Use it to wind a strategy down. Never just delete a line here
# while that strategy still holds stocks; the bot refuses to start until you add it back.
sleeves = { steady = 0.5, swing = 0.5 }
# Stocks you hold by hand in the same account. The bot never buys, sells or warns about them.
ignore_symbols = []
history_days = 600              # calendar days of bars to download on each run (enough for the 252 day average)
state_dir = "state"             # the bot's records: state/paper/ and state/live/ never mix
journal_file = "logs/journal.csv"
log_file = "logs/bot.log"
kill_switch_file = "STOP"       # a file named stop (any case, any extension) here means: no new buys
daily_loss_limit_pct = 0.03     # account lost 3% or more since the previous close: no new buys this run
max_drawdown_pct = 0.20         # account 20% below its best level: the bot writes STOP and stops buying
minutes_before_open_cutoff = 30 # refuse to send orders in the last 30 minutes before the open
max_bad_data_pct = 0.10         # more than 10% of symbols with bad data: sells only, no new buys
stale_data_days = 5             # dry run only: newest bar older than this many days counts as stale
warn_after_failed_runs = 2      # after this many failed runs in a row, warn loudly: positions are unprotected
warn_after_failed_sells = 3     # after a sell has failed this many times, warn loudly: sell it by hand
order_poll_seconds = 20.0       # how long to watch new orders for an answer
order_poll_interval = 2.0
request_timeout_seconds = 20.0  # give up on a broker request after this long (then check what happened)
dry_run_cash = 10000.0          # pretend account size for a dry run
client_order_prefix = "hsw"     # every order id starts with this, so the bot can find its own orders
